<!DOCTYPE html>
<html>
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PhotoCook</title>
        <link rel="stylesheet" href="css/photo-editor.css">
    </head> 
    <body>
        <header>
            <button id="back-btn" aria-label="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <button id="export-btn">Export</button>
        </header>
        <canvas id="canvas" style="width: auto; height: auto;"></canvas>
        <div id="toolbar">
            <button id="add-img">+</button>
            <button id="crop" class="tool-btn">crop</button>
        </div>

                   <!--Javascript area -->


        <script src="javascript/Export/export.js"></script>
        <script>
            /* PhotoCook — Canvas Setup & Export Initialization */
            (() => {
                'use strict';

                const canvas = document.querySelector('canvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                
                // Retrieve saved settings from sessionStorage
                const savedSettings = sessionStorage.getItem('photocookCanvasSettings');

                let actualWidth = 1080;
                let actualHeight = 1080;

                if (savedSettings) {
                    try {
                        const settings = JSON.parse(savedSettings);
                        actualWidth = settings.width;
                        actualHeight = settings.height;
                        console.log(`PhotoCook: Loaded canvas size ${actualWidth}×${actualHeight}`);
                    } catch (error) {
                        console.error('PhotoCook: Failed to parse canvas settings:', error);
                    }
                }

                // 1. Set actual high-resolution drawing buffer
                canvas.width = actualWidth;
                canvas.height = actualHeight;

                // 2. Fill background with white so it exports properly instead of transparent/blank
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 3. Apply professional aspect ratio and visual sizing
                canvas.style.aspectRatio = `${actualWidth} / ${actualHeight}`;
                canvas.style.width = `${actualWidth / 2}px`;

                // 4. Initialize the Export module so the button works!
                if (window.PhotoCookExport) {
                    window.PhotoCookExport.init(canvas, actualWidth, actualHeight);
                }

                // Back button navigation
                const backBtn = document.getElementById('back-btn');
                if (backBtn) {
                    backBtn.addEventListener('click', () => {
                        window.location.href = 'index.html';
                    });
                }
            })();
        </script>
        
    </body>
</html>
