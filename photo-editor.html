<!DOCTYPE html>
<html>
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PhotoCook</title>
        <link rel="stylesheet" href="css/photo-editor.css">
        <link rel="stylesheet" href="css/tool-css.css">

        <!--Library links-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" crossorigin="anonymous">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
        

    </head> 
    <body>
        <header>
            <button id="back-btn" aria-label="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <button id="export-btn">Export</button>
        </header>
        <canvas id="canvas"></canvas>
        <div id="toolbar">
            <button id="add-img">+</button>
            <button id="crop" class="tool-btn">crop</button>
        </div>

                   <!--Javascript area -->


        <script src="javascript/Export/export.js"></script>
        <script src="javascript/Import/import.js"></script>
        <script src="javascript/layer-manager.js"></script>
        <script src="javascript/Interaction/interaction.js"></script>
        <script src="javascript/Interaction/marquee.js"></script>

        <!--Engine-->

        <script src="javascript/engine.js"></script>

        <!--Tools-->

        <script src="javascript/Tools/crop.js"></script>



        <script>
            /* PhotoCook — Canvas Setup & Initialization */
            (() => {
                'use strict';

                const canvas = document.querySelector('canvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                
                // Retrieve saved settings from sessionStorage
                const savedSettings = sessionStorage.getItem('photocookCanvasSettings');

                let actualWidth = 1080;
                let actualHeight = 1080;

                if (savedSettings) {
                    try {
                        const settings = JSON.parse(savedSettings);
                        actualWidth = settings.width;
                        actualHeight = settings.height;
                        console.log(`PhotoCook: Loaded canvas size ${actualWidth}×${actualHeight}`);
                    } catch (error) {
                        console.error('PhotoCook: Failed to parse canvas settings:', error);
                    }
                }

                canvas.width = actualWidth;
                canvas.height = actualHeight;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                canvas.style.aspectRatio = `${actualWidth} / ${actualHeight}`;
                canvas.style.width = `${actualWidth / 2}px`;

                
                if (window.PhotoCookInteraction) {
                    window.PhotoCookInteraction.init(canvas);
                }

                if (window.PhotoCookMarquee && window.PhotoCookLayerManager) {
                    window.PhotoCookMarquee.init(
                        canvas,
                        () => window.PhotoCookLayerManager.getLayers(),
                        (isExporting, overlayFn) => window.PhotoCookInteraction.redrawCanvas(isExporting, overlayFn)
                    );
                }

                if (window.PhotoCookExport) {
                    window.PhotoCookExport.init(canvas, actualWidth, actualHeight);
                }

                if (window.PhotoCookImport) {
                window.PhotoCookImport.init('add-img', (img) => {
                    if (window.PhotoCookLayerManager && window.PhotoCookInteraction) {
                        window.PhotoCookLayerManager.addLayer(img, actualWidth, actualHeight);
                        window.PhotoCookInteraction.redrawCanvas();
                    }
                });
            }

                if (window.PhotoCookEngine) {
                    window.PhotoCookEngine.init(canvas);
                }

                // Crop Tool callback delegates work straight to the engine
                if (window.PhotoCookCrop) {
                    window.PhotoCookCrop.init('crop', (newImg, newWidth, newHeight, layer) => {
                    window.PhotoCookEngine.applyCrop(newImg, newWidth, newHeight, layer);
                    });
                }

                const backBtn = document.getElementById('back-btn');
                if (backBtn) {
                    backBtn.addEventListener('click', () => {
                        window.location.href = 'index.html';
                    });
                }
            })();
        </script>
        
    </body>
</html>
